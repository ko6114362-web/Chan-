name: Chanshop
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chan Shop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          mkdir -p source
          unzip -q ChanShopAndroid_KBZPay_Project.zip -d source
          find source -name "settings.gradle*" -print
            - name: Build APK
          run: |
          SETTINGS_FILE=$(find source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            printf '\nkotlin {\n    jvmToolchain(17)\n}\nandroid {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n' >> "$APP_GRADLE"
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chan-Shop-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
