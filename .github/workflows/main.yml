name: Build Chan Shop APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chan Shop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-35

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -not -path "./source/*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q "$ZIP_FILE" -d source
          else
            echo "No zip file found, copying repository files..."
            cp -r . source/
          fi

      - name: Build APK
        run: |
          SETTINGS_FILE=$(find source -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Android project not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building inside: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chan-Shop-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
